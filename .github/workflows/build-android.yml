name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Import project and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Import project files and remove ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f local-ai-v0.1.zip ]]; then
            unzip -oq local-ai-v0.1.zip -d .
            rm -f local-ai-v0.1.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import Local AI Android project sources"
              git push
            fi
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Project sources are present at repository root."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools"

      - name: Fetch pinned llama.cpp source
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK" || {
            echo "::error::Unsigned release APK not found at $APK"
            exit 1
          }

          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/local-ai-release.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias local-ai-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Local AI Release,O=Local AI,C=BR"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias local-ai-release \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app-release-signed.apk
          rm -f app-release-aligned.apk "$KEYSTORE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-release-signed-apk
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
