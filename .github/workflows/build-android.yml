name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "local-ai-v0.1.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Verify and extract project ZIP
        run: |
          test -f local-ai-v0.1.zip || {
            echo "::error::Upload local-ai-v0.1.zip to the repository root first."
            exit 1
          }
          mkdir project
          unzip -q local-ai-v0.1.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/cpp/CMakeLists.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools"

      - name: Fetch pinned llama.cpp source
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ggml-org/llama.cpp project/app/src/main/cpp/llama.cpp

      - name: Patch JNI source for pinned llama.cpp API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/cpp/llama-jni.cpp")
          s = p.read_text()

          # Repair an accidentally escaped newline between declarations.
          s = s.replace(r'\nstd::mutex g_model_mutex;', '\nstd::mutex g_model_mutex;')

          # Use the memory API present in llama.cpp v0.3.0.
          s = s.replace(
              'llama_kv_cache_clear(g_ctx);',
              'llama_memory_clear(llama_get_memory(g_ctx), true);'
          )

          if '#include <mutex>' not in s:
              s = '#include <mutex>\n' + s
          if '#include <atomic>' not in s:
              s = '#include <atomic>\n' + s

          p.write_text(s)
          if r'\nstd::mutex g_model_mutex;' in s:
              raise SystemExit("Failed to repair escaped newline in llama-jni.cpp")
          if 'llama_kv_cache_clear(g_ctx);' in s:
              raise SystemExit("Unsupported llama_kv_cache_clear call remains")
          if 'llama_memory_clear(llama_get_memory(g_ctx), true);' not in s:
              raise SystemExit("Expected llama.cpp v0.3.0 memory-clear call missing")
          print("JNI source compatibility fixes applied")
          PY
          grep -Fq 'llama_token_to_piece(vocab, token, piece.data(), (int) piece.size(), 0, true)' project/app/src/main/cpp/llama-jni.cpp
          test "$(grep -Fc 'llama_token_to_piece(vocab, token, piece.data(), (int) piece.size(), 0, true)' project/app/src/main/cpp/llama-jni.cpp)" -eq 2

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign release APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK" || {
            echo "::error::Unsigned release APK not found at $APK"
            exit 1
          }

          # Ephemeral signing key: this makes the APK installable, but future
          # workflow runs use a different key unless a persistent keystore is configured.
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/local-ai-release.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias local-ai-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Local AI Release,O=Local AI,C=BR"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias local-ai-release \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app-release-signed.apk
          rm -f app-release-aligned.apk "$KEYSTORE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-release-signed-apk
          path: project/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
