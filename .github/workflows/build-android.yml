name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "package.json"
      - "package-lock.json"
      - "index.js"
      - "*.config.js"
      - "*.ts"
      - "*.tsx"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install React Native, compile native engine and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js for React Native 0.87
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install React Native dependencies
        run: npm install --no-audit --no-fund

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            "platform-tools"

          # Android publishes API 37 as android-37.0 on current SDK repositories.
          # AGP resolves compileSdk 37 to android-37, so create a compatible alias.
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Fetch pinned llama.cpp source
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate React Native autolinking configuration
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the exact CLI entry point Gradle will spawn so failures
          # are reported here with the CLI's stderr, not hidden in settings.
          node node_modules/react-native/cli.js config > "$RUNNER_TEMP/react-native-config.json"
          node -e 'const c = require(process.env.RUNNER_TEMP + "/react-native-config.json"); if (!c.project?.android?.sourceDir) { throw new Error("React Native CLI did not detect the Android project sourceDir"); } console.log("Android sourceDir:", c.project.android.sourceDir); console.log("Autolinked dependencies:", Object.keys(c.dependencies || {}));'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK" || {
            echo "::error::Unsigned release APK not found at $APK"
            exit 1
          }

          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/local-ai-release.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias local-ai-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Local AI Release,O=Local AI,C=BR"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias local-ai-release \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app-release-signed.apk
          rm -f app-release-aligned.apk "$KEYSTORE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-release-signed-apk
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
