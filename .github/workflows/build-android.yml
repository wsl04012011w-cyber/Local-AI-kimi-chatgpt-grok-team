name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "local-ai-v0.1.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Verify and extract project ZIP
        run: |
          test -f local-ai-v0.1.zip || {
            echo "::error::Upload local-ai-v0.1.zip to the repository root first."
            exit 1
          }
          mkdir project
          unzip -q local-ai-v0.1.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/cpp/CMakeLists.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools"

      - name: Fetch pinned llama.cpp source
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ggml-org/llama.cpp project/app/src/main/cpp/llama.cpp

      - name: Adapt JNI bridge to pinned llama.cpp API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/cpp/llama-jni.cpp")
          s = p.read_text()
          old = "llama_token_to_piece(vocab, token, piece.data(), (int) piece.size())"
          new = "llama_token_to_piece(vocab, token, piece.data(), (int) piece.size(), 0, true)"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 outdated llama_token_to_piece calls, found {count}")
          p.write_text(s.replace(old, new))
          print(f"Updated {count} llama_token_to_piece calls for llama.cpp v0.3.0")
          PY

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
